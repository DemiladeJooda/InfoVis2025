<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Visualizations</title>
    <link rel="stylesheet" href="initial_interface.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background-color: #f0f4f8;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .charts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            font-size: 20px;
        }

        .chart-box {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 500px;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .placeholder-text {
            color: #888;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <h2>Visualization Dashboard</h2>

    <div class="charts-container">
        <div class="chart-box">
            <h3>Map here maybe?</h3>
            <div class="placeholder-text">Input Python Chart or Map</div>
        </div>
        <div class="chart-box">
            <h3>pH Levels</h3>
            <div class="placeholder-text">Input Python Chart</div>
        </div>
        <div class="chart-box">
            <h3>Dissolved Oxygen</h3>
            <div class="placeholder-text">Input Python Chart</div>
        </div>
        <div class="chart-box">
            <h3>Turbidity</h3>
            <div class="placeholder-text">Input Python Chart</div>
        </div>
        <div class="chart-box">
            <h3>Pollutant Levels</h3>
            <div class="placeholder-text">Input Python Chart</div>
        </div>
        
        
    </div>

</body>
</html>
