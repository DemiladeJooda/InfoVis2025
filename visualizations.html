<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h1, h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .chart-container {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Water Quality Analysis</h1>
        <h2>Select Date Range</h2>
        <div class="form-group">
            <label for="start-date">Start Date:</label>
            <input type="date" id="start-date">
        </div>
        <div class="form-group">
            <label for="end-date">End Date:</label>
            <input type="date" id="end-date">
        </div>
        <button onclick="filterData()">Filter Data</button>
        
        <h2>Scatter Plot Analysis</h2>
        <div class="form-group">
            <label for="scatter-options">Select Scatter Plot:</label>
            <select id="scatter-options">
                <option value="temp-do">Temperature vs. Dissolved Oxygen</option>
                <option value="ph-cond">pH vs. Conductivity</option>
            </select>
        </div>
        <button onclick="generateScatterPlot()">Generate Plot</button>
        <div class="chart-container">
            <canvas id="scatterChart"></canvas>
        </div>

        <h2>Time Series Analysis</h2>
        <div class="form-group">
            <label for="parameter-select">Select Parameters:</label>
            <select id="parameter-select" multiple>
                <option value="ph">pH</option>
                <option value="temp">Temperature</option>
                <option value="do">Dissolved Oxygen</option>
                <option value="bod">Biological Oxygen Demand</option>
                <option value="tss">Total Suspended Solids</option>
                <option value="ecoli">E. coli</option>
            </select>
        </div>
        <button onclick="generateTimeSeries()">Generate Time Series</button>
        <div class="chart-container">
            <canvas id="timeSeriesChart"></canvas>
        </div>
    </div>

    <script>
        function filterData() {
            const startDate = document.getElementById("start-date").value;
            const endDate = document.getElementById("end-date").value;
            if (new Date(startDate) > new Date(endDate)) {
                alert("Error: Start date must be before end date.");
            } else {
                alert(`Data filtered from ${startDate} to ${endDate}`);
            }
        }

        function generateScatterPlot() {
            alert("Scatter Plot Generated");
        }

        function generateTimeSeries() {
            alert("Time Series Generated");
        }
    </script>
</body>
</html>
