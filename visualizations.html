<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Visualizations</title>
    <link rel="stylesheet" href="initial_interface.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background-color: #f0f4f8;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .charts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            font-size: 20px;
        }

        .chart-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 450px;
            height: 375px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .placeholder-text {
            color: #888;
            font-size: 22px;
        }
        .chart-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Visualization Dashboard</h2>

    <div class="charts-container">
        <div class="chart-box">
            <h3>Interactive Map</h3>
            <div id="map"></div>
        </div>
        <div class="chart-box">
            <img src="./images/chart1.png" alt="Time Series Chart" class="chart-image">
        </div>
        <div class="chart-box">
            <img src="./images/chart2.png" alt="Time Series Chart" class="chart-image">
        </div><div class="chart-box">
            <img src="./images/chart3.png" alt="Time Series Chart" class="chart-image">
        </div><div class="chart-box">
            <img src="./images/chart4.png" alt="Time Series Chart" class="chart-image">
        </div><div class="chart-box">
            <img src="./images/chart5.png" alt="Time Series Chart" class="chart-image">
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {
            preferCanvas: true,
            zoomAnimation: false,
            inertia: true
        }).setView([43.5, -96.7], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            detectRetina: true,
            maxZoom: 18,
        }).addTo(map);

        var locations = [
            { name: "Big Sioux River and I-90", coords: [43.610255, -96.744512] },
            { name: "Big Sioux River @ Timberline", coords: [43.599904, -96.653107] },
            { name: "Big Sioux River @ BAhson", coords: [43.569820, -96.684398] },
            { name: "Skunk Creek @ Marion Road", coords: [43.533928, -96.791001] },
            { name: "Big Sioux @ Falls Park", coords: [43.557252, -96.722152] }
        ];

        locations.forEach((location, index) => {
            L.marker(location.coords)
                .addTo(map)
                .bindPopup(`<b>${location.name}</b><br>Location ${index + 1}`);
        });
    </script>

</body>
</html>
